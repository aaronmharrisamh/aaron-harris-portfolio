<!DOCTYPE html>
<!-- ============================================================
     blog.html - the blog page.

     Markup only. Style lives in site.css and behavior lives in the
     four script trunks, loaded in a fixed order from the head.

     Copy the editor can change is fenced by [edit:slug] comment
     pairs, each wrapping exactly one element. Do not nest a pair
     more than one level deep, and do not put two elements inside
     one pair.

     Sections:
       1. HEAD AND META      4. CONTACT AND FOOTER
       2. CHROME             5. DATA
       3. BLOG

     Five sections. There is no hero and no work section on this
     page, and inventing them to reach seven would be structure
     with nothing under it.
     ============================================================ -->

<html lang="en" data-portrait-bg="1">
<head>
  <!-- ============================================================
       1. HEAD AND META
       ------------------------------------------------------------
       This page's own title, canonical and social cards. Every page
       carries its own; they are not shared chrome.
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Blog — Aaron M. Harris</title>
  <meta name="description" content="Notes on shipping product: technical leadership, solutions architecture, and AI fluency across simulation, XR, and the web." />
  <meta name="author" content="Aaron M. Harris" />
  <meta name="theme-color" content="#16181d" />
  <link rel="canonical" href="https://aaronmichaelharris.com/blog.html" />

  <!-- Favicons -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <!-- Open Graph / social share -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Aaron M. Harris" />
  <meta property="og:title" content="Blog — Aaron M. Harris" />
  <meta property="og:description" content="Notes on shipping product: technical leadership, solutions architecture, and AI fluency across simulation, XR, and the web." />
  <meta property="og:url" content="https://aaronmichaelharris.com/blog.html" />
  <meta property="og:image" content="https://aaronmichaelharris.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Aaron M. Harris — Technical Lead &amp; Solutions Architect." />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blog — Aaron M. Harris" />
  <meta name="twitter:description" content="Notes on shipping product: technical leadership, solutions architecture, and AI fluency across simulation, XR, and the web." />
  <meta name="twitter:image" content="https://aaronmichaelharris.com/og-image.png" />
  <meta name="twitter:creator" content="@aaronmharrisamh" />

  <!-- Inter via Google Fonts (with a robust system fallback in CSS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="site.css" />

  <!-- The site's script, in a fixed order. defer keeps document order and runs
       each file after parsing, so every trunk sees the whole page.
       site.js creates window.AMH, the one namespace the trunks share.
       publish.js is the blog composer. It is on this page only, because the
       manifest and the reading engine are, and it loads after tool.js because
       it builds on the editor kit that tool.js publishes. -->
  <script defer src="site.js"></script>
  <script defer src="work.js"></script>
  <script defer src="blog.js"></script>
  <script defer src="tool.js"></script>
  <script defer src="publish.js"></script>

  <!-- Graceful degradation: without JS the reveal animations never fire, so
       force all content visible.
       These rules stay inline. A <noscript> block applies only when scripting
       is off, and a linked stylesheet cannot carry that condition. -->
  <noscript>
    <style>
      .reveal, .reveal-hero > * { opacity: 1 !important; transform: none !important; }
    </style>
  </noscript>
</head>

<body>
  <!-- ============================================================
       2. CHROME
       ------------------------------------------------------------
       The scroll progress bar, the header, and the nav that doubles
       as the mobile drawer. site.js owns their state.

       The header is shared chrome: byte-identical on every managed
       page, and held to that by the contract test. Its copy regions
       are shared too - an edit to one is written to every page that
       has it, in the same publish. See docs/README.md.
       ============================================================ -->
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="site-header" id="header">
    <a class="brand" href="index.html#top" aria-label="Aaron M. Harris — home">
      <!-- AMH monogram mark kept for reuse elsewhere; the inline-circle portrait
           is the active header mark. To revert to the monogram, swap which of
           these two spans is rendered (and see .brand .mark in the CSS). -->
      <!-- <span class="mark" aria-hidden="true">AMH</span> -->
      <span class="brand-portrait" aria-hidden="true">
        <span class="portrait-bg" aria-hidden="true"></span>
        <img src="aaron-portfolio-portrait-transparent.png" width="512" height="512" alt="" />
      </span>
      <span class="brand__name">
        <!--[edit:brand-title]-->
        <span class="brand__title full">AARON M. HARRIS</span>
        <!--[/edit:brand-title]-->
        <!--[edit:brand-sub]-->
        <span class="brand__sub">Technical Lead &amp; Solutions Architect</span>
        <!--[/edit:brand-sub]-->
      </span>
    </a>

    <button class="nav__toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>

    <!-- A nav link names the page it points into, so the same bytes work on
         every page. site.js treats a link naming THIS page as an in-page
         anchor, and marks the item whose href is this page as current.
         "#contact" stays bare: every page has its own contact section. -->
    <nav class="nav" id="nav" aria-label="Primary">
      <div class="nav__links">
        <!--[edit:nav-work]-->
        <a href="index.html#work">Work</a>
        <!--[/edit:nav-work]-->
        <!--[edit:nav-gallery]-->
        <a href="gallery.html">Gallery</a>
        <!--[/edit:nav-gallery]-->
        <!--[edit:nav-blog]-->
        <a href="blog.html">Blog</a>
        <!--[/edit:nav-blog]-->
        <!--[edit:nav-about]-->
        <a href="index.html#about">About</a>
        <!--[/edit:nav-about]-->
        <!--[edit:nav-contact]-->
        <a href="#contact">Contact</a>
        <!--[/edit:nav-contact]-->
      </div>
    </nav>
  </header>

  <!-- dim scrim behind the mobile nav drawer -->
  <div class="nav-overlay" id="navOverlay" aria-hidden="true"></div>

  <main id="top">

    <!-- ============================================================
         3. BLOG
         ------------------------------------------------------------
         An index, not a stream. Each post appears once, as a date, a
         title, its first paragraph and a link into the month file
         that holds it.

         The index is machine-owned: the publisher writes it, and
         data-ced="generated" makes the editor open it read-only.

         Why an index. A month file is a real standalone page, and a
         LINK to one works from a page opened from disk, where a fetch
         does not. The stream this replaced could only ever read a
         month over http. The full text of a post now exists in
         exactly one place, the month file, and this page carries a
         summary of it.

         The months row above is drawn by blog.js from the manifest
         and filters the cards below. It fetches nothing.

         blog.js does nothing at all on a page without #blogIndex, so
         it is the presence of this container that makes a page the
         blog page.
         ============================================================ -->
    <section class="blog-page" id="blogPage" aria-label="Blog">
      <div class="wrap">
        <div class="section-head reveal">
          <!--[edit:blog-eyebrow]-->
          <span class="eyebrow">Blog</span>
          <!--[/edit:blog-eyebrow]-->
        </div>
        <!--[edit:blog-h2]-->
        <h2>Notes from the work.</h2>
        <!--[/edit:blog-h2]-->
        <div class="bs-months" id="blogMonths"></div>
        <!--[edit:blog-index]-->
        <div class="bs-index" id="blogIndex" data-ced="generated">
          <p class="bs-note">No posts yet - check back soon.</p>
        </div>
        <!--[/edit:blog-index]-->
      </div>
    </section>

    <!-- ============================================================
         4. CONTACT AND FOOTER
         ------------------------------------------------------------
         Shared chrome, like the header: byte-identical with the home
         page, and its copy regions are shared.
         ============================================================ -->
    <section class="contact" id="contact" aria-label="Contact">

          <!--[edit:contact-eyebrow]-->
          <span class="eyebrow eyebrow--center">Contact</span>

          <!--[edit:contact-h2]-->
          <h2>Let's talk.</h2>
          <!--[/edit:contact-h2]-->
          <!--[edit:contact-email]-->
          <a class="email" href="mailto:contact@aaronmichaelharris.com">contact@aaronmichaelharris.com</a>
          <!--[/edit:contact-email]-->
        </div>

        <div class="social-mini reveal d2">
          <a href="https://www.linkedin.com/in/aaronmichaelharris/" target="_blank" rel="noopener" aria-label="LinkedIn">

      </div>

      <!--[edit:endbar]-->
      <div class="endbar">© 2026 Aaron M. Harris · Traverse City, MI</div>

    </section>

  </main>

  <!-- ============================================================
       5. DATA
       ------------------------------------------------------------
       Inert content the scripts read. Nothing here renders.
       ============================================================ -->

  <!-- BLOG MANIFEST · single source of truth for the blog (see docs/README.md).
       Line 1/2: rolling counters (post ids, image numbers - never reused).
       Line 3: pipe-separated entries, each = YYMMDD + 4-digit post id + title.
       Month files are derived from dates (260315... -> blog/2603.html).
       Updated by the blog composer's publish export; edit by hand only if you
       know exactly what you're doing. data-ced="blog" keeps the copy editor
       from treating it as a text region. -->
  <!--[edit:blog-manifest]-->
  <script id="blogManifest" type="text/plain" data-ced="blog">
next-post:0002
next-img:0001
2609020001Test
</script>
  <!--[/edit:blog-manifest]-->
</body>
</html>
