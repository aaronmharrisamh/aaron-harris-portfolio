<!DOCTYPE html>
<!-- ============================================================
     photos.html - the photos page of Greenline Mowing.

     One gallery section of three tiles. The engine's gallery.js packs
     the tiles into six columns, and the page is correct with no
     script at all: each figure carries the span the packer gives it
     at six columns.

     Copy the editor can change is fenced by [edit:slug] comment
     pairs, each wrapping exactly one element.

     Rule: a shared region holds no path. The editor writes one
     region's bytes to every page, and the pages sit at two depths,
     so each nav link keeps its address outside its markers.

     Sections:
       1. HEAD AND META      3. INTRO
       2. CHROME             4. GALLERY
                             5. FOOTER
     ============================================================ -->
<html lang="en">
<head>
  <!-- ============================================================
       1. HEAD AND META
       ============================================================ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photos · Greenline Mowing</title>
  <meta name="description" content="Yards we keep on the north side." />

  <!-- The engine's style first and this site's second, so this site's
       tokens set the theme. -->
  <link rel="stylesheet" href="libraries/harrisxrwebengine/engine.css" />
  <link rel="stylesheet" href="site.css" />

  <!-- The engine's release and this site's facts come first, then the
       engine's trunks in their fixed order. gallery.js follows tool.js,
       because it registers the gallery with the editor. -->
  <script defer src="libraries/harrisxrwebengine/release.js"></script>
  <script defer src="site.config.js"></script>
  <script defer src="libraries/harrisxrwebengine/site.js"></script>
  <script defer src="libraries/harrisxrwebengine/work.js"></script>
  <script defer src="libraries/harrisxrwebengine/imagesengine.js"></script>
  <script defer src="libraries/harrisxrwebengine/tool.js"></script>
  <script defer src="libraries/harrisxrwebengine/gallery.js"></script>
</head>

<body>
  <!-- ============================================================
       2. CHROME
       ------------------------------------------------------------
       The header and the nav, the same regions on every page.
       ============================================================ -->
  <header class="site-header" id="header">
    <a class="brand" href="index.html">
      <!--[edit:brand-title]-->
      <span class="brand__title">GREENLINE MOWING</span>
      <!--[/edit:brand-title]-->
    </a>
    <nav class="nav" id="nav" aria-label="Primary">
      <a href="index.html">
        <!--[edit:nav-home]-->
        <span>Home</span>
        <!--[/edit:nav-home]-->
      </a>
      <a href="services/mowing.html">
        <!--[edit:nav-mowing]-->
        <span>Mowing</span>
        <!--[/edit:nav-mowing]-->
      </a>
      <a href="photos.html">
        <!--[edit:nav-photos]-->
        <span>Photos</span>
        <!--[/edit:nav-photos]-->
      </a>
    </nav>
  </header>

  <main id="top">
    <!-- ============================================================
         3. INTRO
         ============================================================ -->
    <section class="intro" aria-label="Introduction">
      <div class="wrap">
        <!--[edit:photos-title]-->
        <h1>Yards we keep</h1>
        <!--[/edit:photos-title]-->
      </div>
    </section>

    <!-- ============================================================
         4. GALLERY
         ------------------------------------------------------------
         The engine's gallery: a [list:gallery] inside .gal .wrap,
         one [item:id] for each section, and one gal-train in each.
         A section id is permanent.
         ============================================================ -->
    <section class="gal" id="gallery" aria-label="Photo galleries">
      <div class="wrap">

        <!--[list:gallery]-->
        <!--[item:yards]-->
        <!--[edit:gal-yards]-->
        <div class="gal-train" data-section="yards">
          <header class="gal-train__head">
            <span class="gal-train__n"><i class="gal-train__i"></i>Season</span>
            <h3 class="gal-train__title">North side yards</h3>
            <span class="gal-train__rule" aria-hidden="true"></span>
            <span class="gal-train__meta"><span class="gal-train__year">2026</span><span class="gal-train__count">3 images</span></span>
          </header>
          <figure class="gal-tile" data-w="2" data-priority="1" data-span="2">
            <img src="img/yard-1.png" alt="A striped lawn after a weekly mow" loading="lazy" decoding="async"
                 width="640" height="360" />
            <figcaption class="gal-tile__cap">After a weekly mow</figcaption>
          </figure>
          <figure class="gal-tile" data-w="2" data-priority="1" data-span="2">
            <img src="img/yard-2.png" alt="A lawn cut on the diagonal" loading="lazy" decoding="async"
                 width="480" height="360" />
            <figcaption class="gal-tile__cap">Cut on the diagonal</figcaption>
          </figure>
          <figure class="gal-tile" data-w="2" data-priority="2" data-span="2">
            <img src="img/yard-3.png" alt="A checkered lawn" loading="lazy" decoding="async"
                 width="360" height="360" />
            <figcaption class="gal-tile__cap">A checkered cut</figcaption>
          </figure>
        </div>
        <!--[/edit:gal-yards]-->
        <!--[/item:yards]-->
        <!--[/list:gallery]-->

      </div>
    </section>
  </main>

  <!-- ============================================================
       5. FOOTER
       ============================================================ -->
  <footer class="site-footer">
    <!--[edit:endbar]-->
    <div class="endbar">© 2026 Greenline Mowing · North side</div>
    <!--[/edit:endbar]-->
  </footer>
</body>
</html>
