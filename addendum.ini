; addendum.ini - dated notes about this repository that are not rules.
; One section per note, named by its date, YYMMDD. Add each new note at the end.

[260923]
subject = the test suites in the git history
moved = The e2e suite, the marker checker, the media fixtures and the tools moved from tools/ to .localonly/. Git ignores .localonly/, so they are no longer tracked.
history = Their earlier commits stay in the history: 106 file versions in 51 commits, 25 MB as text and about 1 MB after git's compression, of a 21 MB pack. Anyone who reads the history can still see them.
option = git filter-repo can remove tools/ from the history. It rewrites every commit, so every commit hash changes, and every clone and fork must be replaced.
advice = Do it carefully, if at all: when the history's size becomes a cost, or when the old suites must not stay public. Back up the repository first.
